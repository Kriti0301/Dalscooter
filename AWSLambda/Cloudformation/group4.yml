  GetAnalyticsLoginsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GetAnalyticsLogins
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          import json
          import boto3
          from collections import Counter
          from datetime import datetime, timedelta
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              """
              Get login analytics from UserSessions table
              """
              
              try:
                  dynamodb = boto3.resource('dynamodb', region_name='us-east-1')
                  USER_SESSIONS_TABLE = dynamodb.Table('UserSessions')
                  
                  response = USER_SESSIONS_TABLE.scan()
                  sessions = response.get('Items', [])
                  
                  if not sessions:
                      return create_response(200, {
                          'total_sessions': 0,
                          'active_sessions': 0,
                          'average_session_duration': 0
                      })
                  
                  total_sessions = len(sessions)
                  
                  durations = []
                  active_sessions = 0
                  
                  for session in sessions:
                      if 'session_duration' in session and session['session_duration']:
                          try:
                              durations.append(int(session['session_duration']))
                          except:
                              pass
                      
                      if 'logout_time' not in session or not session['logout_time']:
                          active_sessions += 1
                  
                  if durations:
                      avg_duration = round(sum(durations) / len(durations), 2)
                      max_duration = max(durations)
                      min_duration = min(durations)
                  else:
                      avg_duration = max_duration = min_duration = 0
                  
                  user_roles = [session.get('user_role', 'unknown') for session in sessions]
                  role_counts = Counter(user_roles)
                  
                  login_times = []
                  for session in sessions:
                      if 'login_time' in session and session['login_time']:
                          try:
                              login_time = datetime.fromisoformat(session['login_time'].replace('Z', '+00:00'))
                              login_times.append(login_time)
                          except:
                              pass
                  
                  hourly_logins = Counter()
                  daily_logins = Counter()
                  
                  for login_time in login_times:
                      hourly_logins[login_time.hour] += 1
                      daily_logins[login_time.strftime('%Y-%m-%d')] += 1
                  
                  peak_hours = [
                      {'hour': f"{hour}:00", 'login_count': count}
                      for hour, count in hourly_logins.most_common(5)
                  ]
                  
                  seven_days_ago = datetime.utcnow() - timedelta(days=7)
                  recent_sessions = []
                  for s in sessions:
                      if 'login_time' in s and s['login_time']:
                          try:
                              login_dt = datetime.fromisoformat(s['login_time'].replace('Z', '+00:00'))
                              if login_dt > seven_days_ago:
                                  recent_sessions.append(s)
                          except:
                              pass
                  
                  user_agents = [session.get('user_agent', 'unknown') for session in sessions if 'user_agent' in session]
                  device_types = categorize_devices(user_agents)
                  
                  analytics_data = {
                      'total_sessions': total_sessions,
                      'active_sessions': active_sessions,
                      'session_analytics': {
                          'average_duration_minutes': avg_duration,
                          'max_duration_minutes': max_duration,
                          'min_duration_minutes': min_duration,
                          'completion_rate': round(((total_sessions - active_sessions) / total_sessions) * 100, 1) if total_sessions > 0 else 0
                      },
                      'user_role_breakdown': dict(role_counts),
                      'login_patterns': {
                          'peak_hours': peak_hours,
                          'total_unique_days': len(daily_logins),
                          'recent_activity_7_days': len(recent_sessions)
                      },
                      'device_analytics': device_types,
                      'session_health': {
                          'sessions_with_logout': total_sessions - active_sessions,
                          'incomplete_sessions': active_sessions,
                          'data_completeness': round((len([s for s in sessions if 'session_duration' in s and s['session_duration']]) / total_sessions) * 100, 1) if total_sessions > 0 else 0
                      },
                      'last_updated': datetime.utcnow().isoformat() + 'Z'
                  }
                  
                  return create_response(200, analytics_data)
                  
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return create_response(500, {'error': f'Internal server error: {str(e)}'})

          def categorize_devices(user_agents):
              mobile_count = 0
              desktop_count = 0
              tablet_count = 0
              unknown_count = 0
              
              for ua in user_agents:
                  ua_lower = ua.lower() if ua else ''
                  if any(mobile in ua_lower for mobile in ['mobile', 'android', 'iphone']):
                      mobile_count += 1
                  elif any(tablet in ua_lower for tablet in ['tablet', 'ipad']):
                      tablet_count += 1
                  elif any(desktop in ua_lower for desktop in ['windows', 'macintosh', 'linux']):
                      desktop_count += 1
                  else:
                      unknown_count += 1
              
              return {
                  'mobile': mobile_count,
                  'desktop': desktop_count,
                  'tablet': tablet_count,
                  'unknown': unknown_count
              }

          def create_response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
                      'Access-Control-Allow-Headers': 'Content-Type, Authorization'
                  },
                  'body': json.dumps(body, default=str)
              }
      MemorySize: 128
      Timeout: 30

  DeleteFeedbackFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: DeleteFeedback
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          import json
          import boto3
          from datetime import datetime
          import logging
          import base64

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          # Initialize DynamoDB
          dynamodb = boto3.resource('dynamodb')
          FEEDBACKS_TABLE = dynamodb.Table('Feedbacks')

          def lambda_handler(event, context):
              '''
              Delete feedback Lambda function with user authorization
              DELETE /feedbacks/{feedback_id}
              '''
              
              try:
                  logger.info(f"Received event: {json.dumps(event)}")
                  
                  # Extract feedback_id from path parameters
                  path_parameters = event.get('pathParameters') or {}
                  feedback_id = path_parameters.get('feedback_id')
                  
                  logger.info(f"Feedback ID to delete: {feedback_id}")
                  
                  if not feedback_id:
                      return create_response(400, {'error': 'feedback_id path parameter is required'})
                  
                  # Extract user ID from JWT token
                  requesting_user_id = extract_user_id_from_token(event)
                  
                  logger.info(f"Requesting user ID: {requesting_user_id}")
                  
                  if not requesting_user_id:
                      return create_response(401, {'error': 'User authentication required'})
                  
                  # Check if feedback exists and get user_id
                  try:
                      logger.info(f"Getting feedback item from DynamoDB: {feedback_id}")
                      get_response = FEEDBACKS_TABLE.get_item(
                          Key={'feedback_id': feedback_id}
                      )
                      
                      logger.info(f"DynamoDB get_item response: {get_response}")
                      
                      if 'Item' not in get_response:
                          return create_response(404, {'error': 'Feedback not found'})
                      
                      feedback_item = get_response['Item']
                      feedback_owner_id = feedback_item.get('user_id')
                      
                      logger.info(f"Feedback owner ID: {feedback_owner_id}")
                      logger.info(f"Requesting user ID: {requesting_user_id}")
                      
                      # Check if the requesting user owns this feedback
                      if feedback_owner_id != requesting_user_id:
                          return create_response(403, {'error': 'You can only delete your own feedback'})
                      
                      # Check if already deleted
                      if feedback_item.get('is_deleted', False):
                          return create_response(410, {'error': 'Feedback already deleted'})
                          
                  except Exception as e:
                      logger.error(f"Error checking feedback ownership: {str(e)}")
                      return create_response(500, {'error': 'Error accessing feedback data'})
                  
                  # Soft delete the feedback
                  try:
                      logger.info(f"Updating feedback to mark as deleted: {feedback_id}")
                      update_response = FEEDBACKS_TABLE.update_item(
                          Key={'feedback_id': feedback_id},
                          UpdateExpression='SET is_deleted = :deleted, updated_at = :updated_at',
                          ExpressionAttributeValues={
                              ':deleted': True,
                              ':updated_at': datetime.utcnow().isoformat() + 'Z'
                          },
                          ReturnValues='ALL_NEW'
                      )
                      
                      logger.info(f"User {requesting_user_id} deleted feedback: {feedback_id}")
                      
                      return create_response(200, {
                          'message': 'Feedback deleted successfully',
                          'feedback_id': feedback_id,
                          'deleted_at': datetime.utcnow().isoformat() + 'Z'
                      })
                      
                  except Exception as e:
                      logger.error(f"Error deleting feedback: {str(e)}")
                      return create_response(500, {'error': 'Failed to delete feedback'})
                  
              except Exception as e:
                  logger.error(f"Unexpected error in delete feedback: {str(e)}")
                  return create_response(500, {'error': 'Internal server error'})

          def extract_user_id_from_token(event):
              """
              Extract user ID from JWT token using simple base64 decoding
              """
              try:
                  # Try to get from API Gateway authorizer first (if configured)
                  request_context = event.get('requestContext', {})
                  authorizer = request_context.get('authorizer', {})
                  claims = authorizer.get('claims', {})
                  user_id = claims.get('sub')
                  
                  if user_id:
                      logger.info(f"Got user ID from authorizer: {user_id}")
                      return user_id
                  
                  # Parse from Authorization header
                  headers = event.get('headers', {})
                  logger.info(f"Request headers: {headers}")
                  
                  auth_header = None
                  for key, value in headers.items():
                      if key.lower() == 'authorization':
                          auth_header = value
                          break
                  
                  if not auth_header:
                      logger.error("No Authorization header found")
                      return None
                  
                  if not auth_header.startswith('Bearer '):
                      logger.error("Authorization header does not start with 'Bearer '")
                      return None
                  
                  token = auth_header[7:]  # Remove "Bearer " prefix
                  logger.info(f"Extracted token: {token[:50]}...")  # Log first 50 chars only
                  
                  # JWT tokens have 3 parts separated by dots
                  parts = token.split('.')
                  if len(parts) != 3:
                      logger.error("Invalid JWT token format")
                      return None
                  
                  # Decode the payload (second part)
                  payload = parts[1]
                  
                  # Add padding if needed for base64 decoding
                  padding = len(payload) % 4
                  if padding:
                      payload += '=' * (4 - padding)
                  
                  # Decode base64
                  decoded_bytes = base64.urlsafe_b64decode(payload)
                  decoded_json = json.loads(decoded_bytes.decode('utf-8'))
                  
                  logger.info(f"Decoded JWT payload: {decoded_json}")
                  
                  user_id = decoded_json.get('sub')
                  logger.info(f"Extracted user ID from token: {user_id}")
                  
                  return user_id
                  
              except Exception as e:
                  logger.error(f"Error extracting user ID from token: {str(e)}")
                  import traceback
                  logger.error(f"Traceback: {traceback.format_exc()}")
                  return None

          def create_response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
                      'Access-Control-Allow-Headers': 'Content-Type, Authorization'
                  },
                  'body': json.dumps(body, default=str)
              }
      MemorySize: 128
      Timeout: 30

