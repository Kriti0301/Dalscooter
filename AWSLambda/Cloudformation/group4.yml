AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Combined CloudFormation template for Cognito, Lambdas, HTTP API, and Notification system.

Parameters:
  SmtpHostParameter:
    Type: String
    Description: SMTP host (e.g. smtp.gmail.com)
  SmtpPortParameter:
    Type: Number
    Default: 587
    Description: SMTP port (usually 587)
  SmtpUserParameter:
    Type: String
    Description: SMTP username/email
  SmtpPassParameter:
    Type: String
    NoEcho: true
    Description: SMTP password or app password
  SenderEmailParameter:
    Type: String
    Description: Sender email address (e.g. no-reply@dalscooter.com)
  LabRoleArn:
    Type: String
    Description: ARN of the IAM Role all Lambdas will assume
    Default: arn:aws:iam::${AWS::AccountId}:role/LabRole

Resources:
  # Booking & Auth tables
  ScootersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Scooters
      AttributeDefinitions:
        - AttributeName: scooter_id
          AttributeType: S
      KeySchema:
        - AttributeName: scooter_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  TripsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Trips
      AttributeDefinitions:
        - AttributeName: trip_id
          AttributeType: S
      KeySchema:
        - AttributeName: trip_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CustomerFranchiseMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CustomerFranchiseMessages
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PendingChatRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PendingChatRequests
      AttributeDefinitions:
        - AttributeName: trip_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: trip_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  TripMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TripMessages
      AttributeDefinitions:
        - AttributeName: trip_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: trip_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Analytics
      AttributeDefinitions:
        - AttributeName: metric_id
          AttributeType: S
      KeySchema:
        - AttributeName: metric_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  FeedbacksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Feedbacks
      AttributeDefinitions:
        - AttributeName: feedback_id
          AttributeType: S
      KeySchema:
        - AttributeName: feedback_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  UserSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserSessions
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST


  # SNS Topic for user notifications
  UserNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: userNotification

  # SQS Queue subscribed to SNS Topic
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: userNotificationQueue

  # Subscribe SQS Queue to SNS Topic
  SnsToSqsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref UserNotificationTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationQueue.Arn

  # Allow SNS to send messages to SQS
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [ !Ref NotificationQueue ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Allow-SNS-SendMessage
            Effect: Allow
            Principal: '*'
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref UserNotificationTopic

  ########################################
  # Lambda: PostConfirmation trigger
  AssignUserGroupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AssignUserGroup
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          const { CognitoIdentityProviderClient, AdminAddUserToGroupCommand } = require("@aws-sdk/client-cognito-identity-provider");
          const cognito = new CognitoIdentityProviderClient({});
          exports.handler = async (event) => {
            const userPoolId = event.userPoolId;
            const username = event.userName;
            const role = event.request.userAttributes["custom:role"];
            if (role === "franchise" || role === "user") {
              await cognito.send(new AdminAddUserToGroupCommand({
                GroupName: role,
                UserPoolId: userPoolId,
                Username: username
              }));
            }
            return event;
          };
      MemorySize: 128
      Timeout: 10

  SetUserSessionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: SetUserSessions
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          import json
          import boto3
          import uuid
          from datetime import datetime, timedelta
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          dynamodb = boto3.resource('dynamodb', region_name='us-east-1')
          USER_SESSIONS_TABLE = dynamodb.Table('UserSessions')

          def lambda_handler(event, context):
              """
              Manage user sessions - create, update, and end sessions
              """
              
              try:
                  # Parse request
                  if event.get('body'):
                      if isinstance(event['body'], str):
                          body = json.loads(event['body'])
                      else:
                          body = event['body']
                  else:
                      return create_response(400, {'error': 'Request body is required'})
                  
                  action = body.get('action')  # 'login', 'logout', 'update'
                  
                  if action == 'login':
                      return handle_login(body)
                  elif action == 'logout':
                      return handle_logout(body)
                  elif action == 'update':
                      return handle_update(body)
                  else:
                      return create_response(400, {'error': 'Invalid action. Use: login, logout, update'})
                      
              except Exception as e:
                  logger.error(f"Error in session manager: {str(e)}")
                  return create_response(500, {'error': f'Internal server error: {str(e)}'})

          def handle_login(body):
              """
              Create a new user session on login
              """
              try:
                  # Required fields
                  user_id = body.get('user_id')
                  user_role = body.get('user_role', 'user')
                  ip_address = body.get('ip_address', 'unknown')
                  user_agent = body.get('user_agent', 'unknown')
                  
                  if not user_id:
                      return create_response(400, {'error': 'user_id is required'})
                  
                  # Generate session
                  session_id = f"session_{str(uuid.uuid4())[:8]}"
                  current_time = datetime.utcnow()
                  login_time = current_time.isoformat() + 'Z'
                  
                  # Calculate TTL (24 hours from now)
                  ttl_time = current_time + timedelta(hours=24)
                  ttl = int(ttl_time.timestamp())
                  
                  session_item = {
                      'session_id': session_id,
                      'user_id': user_id,
                      'user_role': user_role,
                      'ip_address': ip_address,
                      'user_agent': user_agent,
                      'login_time': login_time,
                      'logout_time': None,
                      'session_duration': None,
                      'ttl': ttl
                  }
                  
                  # Store session
                  USER_SESSIONS_TABLE.put_item(Item=session_item)
                  
                  logger.info(f"Created session {session_id} for user {user_id}")
                  
                  return create_response(201, {
                      'message': 'Session created successfully',
                      'session_id': session_id,
                      'login_time': login_time
                  })
                  
              except Exception as e:
                  logger.error(f"Error creating session: {str(e)}")
                  return create_response(500, {'error': f'Failed to create session: {str(e)}'})

          def handle_logout(body):
              """
              End a user session on logout
              """
              try:
                  session_id = body.get('session_id')
                  user_id = body.get('user_id')
                  
                  if not session_id and not user_id:
                      return create_response(400, {'error': 'session_id or user_id is required'})
                  
                  current_time = datetime.utcnow()
                  logout_time = current_time.isoformat() + 'Z'
                  
                  # Find session to update
                  if session_id:
                      # Update by session_id
                      try:
                          response = USER_SESSIONS_TABLE.get_item(Key={'session_id': session_id})
                          if 'Item' not in response:
                              return create_response(404, {'error': 'Session not found'})
                          
                          session = response['Item']
                          login_time_str = session.get('login_time')
                          
                          # Calculate duration
                          duration = 0
                          if login_time_str:
                              try:
                                  login_dt = datetime.fromisoformat(login_time_str.replace('Z', '+00:00'))
                                  duration = int((current_time - login_dt.replace(tzinfo=None)).total_seconds() / 60)
                              except:
                                  pass
                          
                          # Update session
                          USER_SESSIONS_TABLE.update_item(
                              Key={'session_id': session_id},
                              UpdateExpression='SET logout_time = :logout_time, session_duration = :duration',
                              ExpressionAttributeValues={
                                  ':logout_time': logout_time,
                                  ':duration': duration
                              }
                          )
                          
                          logger.info(f"Updated session {session_id} with logout time")
                          
                          return create_response(200, {
                              'message': 'Session ended successfully',
                              'session_id': session_id,
                              'logout_time': logout_time,
                              'duration_minutes': duration
                          })
                          
                      except Exception as e:
                          logger.error(f"Error updating session {session_id}: {str(e)}")
                          return create_response(500, {'error': f'Failed to update session: {str(e)}'})
                  
                  else:
                      # Find active session by user_id
                      try:
                          response = USER_SESSIONS_TABLE.scan(
                              FilterExpression='user_id = :user_id AND attribute_not_exists(logout_time)',
                              ExpressionAttributeValues={':user_id': user_id}
                          )
                          
                          sessions = response.get('Items', [])
                          if not sessions:
                              return create_response(404, {'error': 'No active session found for user'})
                          
                          # Update the most recent session
                          session = sessions[0]
                          session_id = session['session_id']
                          
                          login_time_str = session.get('login_time')
                          duration = 0
                          if login_time_str:
                              try:
                                  login_dt = datetime.fromisoformat(login_time_str.replace('Z', '+00:00'))
                                  duration = int((current_time - login_dt.replace(tzinfo=None)).total_seconds() / 60)
                              except:
                                  pass
                          
                          USER_SESSIONS_TABLE.update_item(
                              Key={'session_id': session_id},
                              UpdateExpression='SET logout_time = :logout_time, session_duration = :duration',
                              ExpressionAttributeValues={
                                  ':logout_time': logout_time,
                                  ':duration': duration
                              }
                          )
                          
                          logger.info(f"Updated session {session_id} for user {user_id}")
                          
                          return create_response(200, {
                              'message': 'Session ended successfully',
                              'session_id': session_id,
                              'logout_time': logout_time,
                              'duration_minutes': duration
                          })
                          
                      except Exception as e:
                          logger.error(f"Error finding/updating session for user {user_id}: {str(e)}")
                          return create_response(500, {'error': f'Failed to end session: {str(e)}'})
              
              except Exception as e:
                  logger.error(f"Error in logout handler: {str(e)}")
                  return create_response(500, {'error': f'Logout failed: {str(e)}'})

          def handle_update(body):
              """
              Update session information (like user_agent, ip_address)
              """
              try:
                  session_id = body.get('session_id')
                  if not session_id:
                      return create_response(400, {'error': 'session_id is required'})
                  
                  # Build update expression
                  update_parts = []
                  attr_values = {}
                  
                  if 'ip_address' in body:
                      update_parts.append('ip_address = :ip')
                      attr_values[':ip'] = body['ip_address']
                  
                  if 'user_agent' in body:
                      update_parts.append('user_agent = :ua')
                      attr_values[':ua'] = body['user_agent']
                  
                  if not update_parts:
                      return create_response(400, {'error': 'No fields to update'})
                  
                  update_expression = 'SET ' + ', '.join(update_parts)
                  
                  USER_SESSIONS_TABLE.update_item(
                      Key={'session_id': session_id},
                      UpdateExpression=update_expression,
                      ExpressionAttributeValues=attr_values
                  )
                  
                  return create_response(200, {'message': 'Session updated successfully'})
                  
              except Exception as e:
                  logger.error(f"Error updating session: {str(e)}")
                  return create_response(500, {'error': f'Failed to update session: {str(e)}'})

          def create_response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
                      'Access-Control-Allow-Headers': 'Content-Type, Authorization'
                  },
                  'body': json.dumps(body, default=str)
              }
      MemorySize: 128
      Timeout: 30

  # Lambda: user registration
  UserRegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: UserRegister
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          USER_NOTIFICATION_TOPIC_ARN: !Ref UserNotificationTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          dynamodb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          TOPIC_ARN = os.environ['USER_NOTIFICATION_TOPIC_ARN']

          def lambda_handler(event, context):
              body = json.loads(event.get('body','{}'))
              missing = [k for k in ['email','name','role','securityAnswer','shiftKey'] if not body.get(k)]
              if missing:
                  return {'statusCode':400,'body':json.dumps({'error':f"Missing fields: {', '.join(missing)}"})}
              item = {k: body[k] for k in ['email','name','role','securityAnswer','shiftKey']}
              dynamodb.Table('Users').put_item(Item=item)
              # publish to SNS
              message = {'to':body['email'],'subject':'Welcome to Dal scooter!','body':f"Hi {body['name']}, welcome to Dal scooter!"}
              sns.publish(TopicArn=TOPIC_ARN, Message=json.dumps(message))
              return {'statusCode':200,'body':json.dumps({'message':'User registered'})}
      MemorySize: 128
      Timeout: 10

  # Lambda: fetch security answer
  FetchSecurityAnswerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: FetchSecurityAnswer
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          import json, boto3
          table = boto3.resource('dynamodb').Table('Users')
          def lambda_handler(event, context):
              body=json.loads(event.get('body','{}'))
              email=body.get('email')
              if not email:
                  return {'statusCode':400,'body':json.dumps({'error':'Email required'})}
              resp = table.get_item(Key={'email':email})
              if 'Item' not in resp:
                  return {'statusCode':404,'body':json.dumps({'error':'User not found'})}
              return {'statusCode':200,'body':json.dumps({'securityAnswer':resp['Item']['securityAnswer']})}
      MemorySize: 128
      Timeout: 10

  # Lambda: fetch shift key
  FetchShiftKeyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: FetchShiftKey
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          USER_NOTIFICATION_TOPIC_ARN: !Ref UserNotificationTopic
      Code:
        ZipFile: |
          import json, boto3
          import os

          sns = boto3.client('sns')
          TOPIC_ARN = os.environ['USER_NOTIFICATION_TOPIC_ARN']

          table = boto3.resource('dynamodb').Table('Users')
          def lambda_handler(event, context):
              body=json.loads(event.get('body','{}'))
              email=body.get('email')
              if not email:
                  return {'statusCode':400,'body':json.dumps({'error':'Email required'})}
              resp = table.get_item(Key={'email':email})
              if 'Item' not in resp:
                  return {'statusCode':404,'body':json.dumps({'error':'User not found'})}
              
              # publish to SNS
              message = {'to':email,'subject':'Login Alert for Your Dal Scooter Account','body':f"Hi,\n\nWe noticed a new login to your Dal Scooter account.\nIf this wasn't you, please reset your password immediately.\n\nStay safe,\nDal Scooter Team"}
              sns.publish(TopicArn=TOPIC_ARN, Message=json.dumps(message))

              return {'statusCode':200,'body':json.dumps({'shiftKey':resp['Item']['shiftKey']})}
      MemorySize: 128
      Timeout: 10

  ########################################
  # Notification Sender Lambda triggered by SQS
  SendEmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: SendEmail
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          SMTP_HOST: !Ref SmtpHostParameter
          SMTP_PORT: !Ref SmtpPortParameter
          SMTP_USER: !Ref SmtpUserParameter
          SMTP_PASS: !Ref SmtpPassParameter
          SENDER_EMAIL: !Ref SenderEmailParameter
      Code:
        ZipFile: |
          import json
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          SMTP_HOST = os.environ['SMTP_HOST']
          SMTP_PORT = int(os.environ.get('SMTP_PORT',587))
          SMTP_USER = os.environ['SMTP_USER']
          SMTP_PASS = os.environ['SMTP_PASS']
          SENDER_EMAIL = os.environ['SENDER_EMAIL']

          def lambda_handler(event, context):
              for record in event.get('Records', []):
                  sns_msg = json.loads(record['body'])
                  email_data = json.loads(sns_msg['Message'])
                  msg = MIMEMultipart()
                  msg['From'] = SENDER_EMAIL
                  msg['To'] = email_data['to']
                  msg['Subject'] = email_data['subject']
                  msg.attach(MIMEText(email_data['body'],'plain'))
                  with smtplib.SMTP(SMTP_HOST,SMTP_PORT) as server:
                      server.starttls()
                      server.login(SMTP_USER,SMTP_PASS)
                      server.sendmail(SENDER_EMAIL,email_data['to'],msg.as_string())
              return {'statusCode':200,'body':json.dumps('Processed.')}
      MemorySize: 128
      Timeout: 30

  # Trigger SendEmailFunction from SQS
  SendEmailEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt NotificationQueue.Arn
      FunctionName: !GetAtt SendEmailFunction.Arn
      BatchSize: 10
      Enabled: true

  ########################################
  # Booking Module Lambdas
  StartTripFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: StartTrip
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          USER_NOTIFICATION_TOPIC_ARN: !Ref UserNotificationTopic
      Code:
        ZipFile: |
          import json, uuid
          from datetime import datetime
          import boto3
          import os
          from decimal import Decimal

          def to_decimal(val):
              if isinstance(val, float): return Decimal(str(val))
              if isinstance(val, list): return [to_decimal(v) for v in val]
              if isinstance(val, dict): return {k: to_decimal(v) for k,v in val.items()}
              return val

          dynamodb = boto3.resource('dynamodb')
          scooter_table = dynamodb.Table('Scooters')
          trip_table = dynamodb.Table('Trips')
          sns = boto3.client('sns')
          TOPIC_ARN = os.environ['USER_NOTIFICATION_TOPIC_ARN']

          def lambda_handler(event, context):
              body = json.loads(event['body'])
              scooter_id = body['scooter_id']; user_id = body['user_id']
              scooter = scooter_table.get_item(Key={'scooter_id':scooter_id}).get('Item')
              if not scooter or scooter['status']!='available':
                  return {'statusCode':400,'body':json.dumps({'message':'Scooter not available'})}
              scooter_table.update_item(
                  Key={'scooter_id':scooter_id},
                  UpdateExpression='SET #s = :u',
                  ExpressionAttributeNames={'#s':'status'},
                  ExpressionAttributeValues={':u':'in_use'}
              )
              trip_id = str(uuid.uuid4())
              trip_item = to_decimal({
                  'trip_id':trip_id,
                  'user_id':user_id,
                  'scooter_id':scooter_id,
                  'start_time':datetime.utcnow().isoformat(),
                  'start_location':body['start_location'],
                  'status':'ongoing'
              })
              trip_table.put_item(Item=trip_item)
              # publish to SNS
              message = {'to':body['email'],'subject':'Your Dal Scooter Trip Has Started!','body':f"Your Dal Scooter trip has just started!\n\n"}
              sns.publish(TopicArn=TOPIC_ARN, Message=json.dumps(message))

              return {'statusCode':201,'body':json.dumps({'trip_id':trip_id})}
      MemorySize: 128
      Timeout: 10
  
  EndTripFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: EndTrip
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          USER_NOTIFICATION_TOPIC_ARN: !Ref UserNotificationTopic
      Code:
        ZipFile: |
          import json, boto3
          from decimal import Decimal
          from datetime import datetime
          import os

          def to_decimal(val):
              if isinstance(val, float): return Decimal(str(val))
              if isinstance(val, list): return [to_decimal(v) for v in val]
              if isinstance(val, dict): return {k: to_decimal(v) for k,v in val.items()}
              return val

          dynamodb = boto3.resource('dynamodb')
          trip_table = dynamodb.Table('Trips')
          scooter_table = dynamodb.Table('Scooters')
          sns = boto3.client('sns')
          TOPIC_ARN = os.environ['USER_NOTIFICATION_TOPIC_ARN']

          def calc_price(start, end):
              minutes = (end - start).total_seconds() / 60
              return Decimal('1') + Decimal(str(minutes * 0.25))

          def lambda_handler(event, context):
              body = json.loads(event['body'])
              trip_id = body['trip_id']
              end_loc = to_decimal(body['end_location'])

              trip = trip_table.get_item(Key={'trip_id': trip_id}).get('Item')
              if not trip or trip['status'] != 'ongoing':
                  return {'statusCode':400,'body':json.dumps({'message':'Trip not active'})}

              end_time = datetime.utcnow()
              start_time = datetime.fromisoformat(trip['start_time'])
              price = calc_price(start_time, end_time)

              trip_table.update_item(
                  Key={'trip_id': trip_id},
                  UpdateExpression='SET end_time=:et, end_location=:el, #s=:st, price=:p',
                  ExpressionAttributeNames={'#s':'status'},
                  ExpressionAttributeValues={
                      ':et': end_time.isoformat(),
                      ':el': end_loc,
                      ':st': 'completed',
                      ':p': price
                  }
              )
              scooter_table.update_item(
                  Key={'scooter_id': trip['scooter_id']},
                  UpdateExpression='SET #s=:av',
                  ExpressionAttributeNames={'#s':'status'},
                  ExpressionAttributeValues={':av':'available'}
              )

              # publish to SNS
              message = {'to':body['email'],'subject':'Your Dal Scooter Trip Has Ended!','body':f"Your Dal Scooter trip has just ended!\n\n"}
              sns.publish(TopicArn=TOPIC_ARN, Message=json.dumps(message))

              return {'statusCode':200,'body':json.dumps({'price': float(price)})}
      MemorySize: 128
      Timeout: 10
  
  GetTripsByUserIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GetTripsByUserId
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          import json, decimal
          import boto3
          from boto3.dynamodb.conditions import Attr

          table = boto3.resource('dynamodb').Table('Trips')

          def json_dumps_decimal(data):
              return json.dumps(data, default=lambda o: float(o) if isinstance(o, decimal.Decimal) else o)

