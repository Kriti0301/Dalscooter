  # Permissions: Cognito PostConfirmation
  AssignUserGroupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AssignUserGroupFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt DalScooterUserPool.Arn

  # Cognito User Pool & Groups
  DalScooterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Dal Scooter User pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
      LambdaConfig:
        PostConfirmation: !GetAtt AssignUserGroupFunction.Arn
  
  DalScooterUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: dalscooter-client
      UserPoolId: !Ref DalScooterUserPool
      GenerateSecret: false
      ExplicitAuthFlows: [USER_PASSWORD_AUTH]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
  
  FranchiseGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Franchise, UserPoolId: !Ref DalScooterUserPool, RoleArn: !Ref LabRoleArn, Precedence: 2 }
  
  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: User, UserPoolId: !Ref DalScooterUserPool, RoleArn: !Ref LabRoleArn, Precedence: 1 }
Outputs:
  HttpApiId:
    Description: Cognito HTTP API ID
    Value: !Ref DalScooterHttpApi
  HttpApiUrl:
    Description: Invoke URL of the HTTP API (default stage)
    Value: !Sub "https://${DalScooterHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref DalScooterUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref DalScooterUserPoolClient
  UserNotificationTopicArn:
    Description: ARN of the SNS topic for notifications
    Value: !Ref UserNotificationTopic
  NotificationQueueArn:
    Description: ARN of the SQS queue subscribed to SNS
    Value: !GetAtt NotificationQueue.Arn
