  UpdateScooterByIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: UpdateScooterById
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !Ref LabRoleArn
      Code:
        ZipFile: |
          import json, decimal
          from decimal import Decimal
          import boto3

          def to_decimal(val):
              if isinstance(val, float): return Decimal(str(val))
              if isinstance(val, list): return [to_decimal(v) for v in val]
              if isinstance(val, dict): return {k: to_decimal(v) for k,v in val.items()}
              return val

          table = boto3.resource('dynamodb').Table('Scooters')

          def lambda_handler(event, context):
              scooter_id = (event.get('pathParameters') or {}).get('scooter_id')
              body = json.loads(event.get('body','{}'))
              update_parts, names, vals = [], {}, {}
              if 'lat' in body: update_parts.append('lat = :lat'); vals[':lat']=Decimal(str(body['lat']))
              if 'long' in body: update_parts.append('#lng = :lng'); vals[':lng']=Decimal(str(body['long'])); names['#lng']='long'
              if 'status' in body: update_parts.append('#st = :st'); vals[':st']=body['status']; names['#st']='status'
              if 'metadata' in body: update_parts.append('metadata = :md'); vals[':md']=to_decimal(body['metadata'])
              if not update_parts: return {'statusCode':400,'body':json.dumps({'message':'No fields'})}
              res = table.update_item(Key={'scooter_id':scooter_id},
                                     UpdateExpression='SET '+','.join(update_parts),
                                     ExpressionAttributeNames=names or None,
                                     ExpressionAttributeValues=vals,
                                     ReturnValues='ALL_NEW')
              return {'statusCode':200,'body':json.dumps(res['Attributes'], default=str)}
      MemorySize: 128
      Timeout: 10

